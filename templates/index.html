<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanet Hunter AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --danger: #ff3366;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-box {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            margin-top: 40px;
            display: none;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            animation: fadeIn 0.5s ease;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .status-planet {
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .status-noise {
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .metrics {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 5px;
        }

        .graph-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 20px;
        }

        .graph-container img {
            width: 100%;
            display: block;
        }

        .loader {
            display: none;
            margin-top: 40px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        .error-message {
            display: none;
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--danger);
            margin-top: 20px;
            text-align: center;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Exoplanet Hunter AI</h1>
            <p class="subtitle">Powered by Deep Learning & NASA TESS Data</p>
        </header>

        <div class="search-box">
            <input type="text" id="starInput" placeholder="Enter Star ID (e.g., TIC 261136679)" value="TIC 261136679">
            <button id="scanBtn" onclick="scanStar()">Scan Target</button>
        </div>

        <div class="error-message" id="errorBox"></div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); font-size: 1.1rem;" id="loadingText">Connecting to NASA MAST Database...</p>
        </div>

        <div class="results" id="results">
            <div class="status-badge" id="statusBadge">PLANET DETECTED</div>
            
            <div class="metrics">
                <div class="metric-card">
                    <div style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">AI Confidence</div>
                    <div class="metric-value" id="confidenceValue">99.9%</div>
                </div>
                <div class="metric-card">
                    <div style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;">Orbital Period</div>
                    <div class="metric-value" id="periodValue">6.26 Days</div>
                </div>
            </div>

            <div class="graph-container">
                <img id="transitGraph" src="" alt="Transit Graph">
            </div>
        </div>
    </div>

    <script>
        const loadingTexts = [
            "Connecting to NASA MAST Database...",
            "Downloading SPOC Light Curve...",
            "Running BLS Algorithm...",
            "Folding and Binning Data...",
            "Normalizing using Z-Score...",
            "Running Neural Network Inference..."
        ];

        async function scanStar() {
            const starInput = document.getElementById('starInput').value;
            const btn = document.getElementById('scanBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const errorBox = document.getElementById('errorBox');
            const loadingText = document.getElementById('loadingText');

            if (!starInput) return;

            btn.disabled = true;
            results.style.display = 'none';
            errorBox.style.display = 'none';
            loader.style.display = 'block';

            let textIdx = 0;
            const textInterval = setInterval(() => {
                textIdx = (textIdx + 1) % loadingTexts.length;
                loadingText.innerText = loadingTexts[textIdx];
            }, 2500);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ star_id: starInput })
                });
                
                const data = await response.json();
                clearInterval(textInterval);
                loader.style.display = 'none';

                if (data.error) {
                    errorBox.innerText = data.error;
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    return;
                }

                const badge = document.getElementById('statusBadge');
                const confValue = document.getElementById('confidenceValue');
                
                if (data.veto) {
                    badge.className = 'status-badge status-noise';
                    badge.innerText = '⚠️ REJECTED: ARTIFACT';
                    badge.style.color = '#fbbf24';
                    badge.style.borderColor = '#fbbf24';
                    badge.style.backgroundColor = 'rgba(251, 191, 36, 0.1)';
                    confValue.innerText = 'VETO';
                    confValue.style.color = '#fbbf24';
                } else if (data.prediction > 0.5) {
                    badge.className = 'status-badge status-planet';
                    badge.innerText = '🌟 PLANET DETECTED';
                    badge.style.color = 'var(--accent)';
                    badge.style.borderColor = 'var(--accent)';
                    badge.style.backgroundColor = 'rgba(0, 255, 204, 0.1)';
                    confValue.innerText = (data.prediction * 100).toFixed(2) + '%';
                    confValue.style.color = 'var(--accent)';
                } else {
                    badge.className = 'status-badge status-noise';
                    badge.innerText = '❌ NO PLANET (NOISE)';
                    badge.style.color = 'var(--danger)';
                    badge.style.borderColor = 'var(--danger)';
                    badge.style.backgroundColor = 'rgba(255, 51, 102, 0.1)';
                    confValue.innerText = ((1 - data.prediction) * 100).toFixed(2) + '%';
                    confValue.style.color = 'var(--danger)';
                }

                document.getElementById('periodValue').innerText = data.period.toFixed(4) + ' Days';
                document.getElementById('transitGraph').src = data.image_url + '?t=' + new Date().getTime();

                results.style.display = 'block';
                
            } catch (err) {
                clearInterval(textInterval);
                loader.style.display = 'none';
                errorBox.innerText = "Connection error. Make sure the Flask server is running.";
                errorBox.style.display = 'block';
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
